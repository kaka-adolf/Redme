<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050505">

    <meta
        name="description"
        content="marda.6045 Snapchat"
    >

    <title>marda.6045 | Snapchat</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="background-photo"></div>

        <div class="dark-overlay"></div>

        <div class="yellow-glow glow-one"></div>
        <div class="yellow-glow glow-two"></div>

        <div class="stars">
            <span></span>

            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="perspective-grid"></div>

    </div>


    <!-- Cursor light -->
    <div class="cursor-light"></div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <div class="card" id="card">

            <div class="card-shine"></div>


            <!-- =================================================
                 PROFILE IMAGE
            ================================================== -->

            <div class="profile-image-container">

                <div class="rotating-ring ring-one"></div>

                <div class="rotating-ring ring-two"></div>

                <div class="profile-image-box">

                    <!--
                        IMPORTANT:
                        تەنها ناوی photo.jpg بگۆڕە
                        بۆ ناوی وێنەکەت
                    -->

                    <img
                        src="photo.jpg"
                        alt="Marda"
                        class="profile-image"
                    >

                </div>


                <!-- Online -->
                <div class="online">

                    <span></span>

                </div>

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <div class="profile-info">

                <div class="platform">
                    SNAPCHAT
                </div>

                <h1>
                    marda.6045
                </h1>

                <div class="username">
                    @marda.6045
                </div>

                <p>
                    بەخێربێیت بۆ Snapchat ـی من 👻
                    <br>
                    بۆ پەیوەندیکردن سەردانی پڕۆفایلەکەم بکە.
                </p>

            </div>


            <!-- =================================================
                 SNAPCHAT BUTTON
            ================================================== -->

            <a
                href="https://www.snapchat.com/add/marda.6045"
                target="_blank"
                rel="noopener noreferrer"
                class="snap-button"
            >

                <div class="button-image">

                    <!-- هەمان وێنە -->
                    <img
                        src="photo.jpg"
                        alt="Marda"
                    >

                </div>


                <div class="button-content">

                    <strong>
                        Snapchat
                    </strong>

                    <span>
                        marda.6045
                    </span>

                </div>


                <div class="button-arrow">
                    ←
                </div>

            </a>

                 SNAPCODE
            ================================================== -->
